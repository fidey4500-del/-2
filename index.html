<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인체 탐험 세계 일주 부루마블</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12304f; --navy2:#0b2038; --paper:#fbf4e2; --ink:#1d2b3a; --line:#c9b98f;
  --gold:#e0a422; --red:#d9483b; --ok:#1f9d57;
  --bs:min(calc(100vh - 20px), calc(100vw - 320px));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);
  background:radial-gradient(circle at 20% 10%,#1c4a78 0,var(--navy) 40%,var(--navy2) 100%);min-height:100vh}
h1,h2,h3,.jua{font-family:"Jua","Malgun Gothic",sans-serif;font-weight:400;margin:0}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
.hidden{display:none!important}

/* ---------- 입장 화면 ---------- */
#join{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.joinCard{background:var(--paper);border-radius:22px;padding:28px 26px;width:min(440px,100%);
  box-shadow:0 20px 60px #0008;border:3px solid var(--gold)}
.joinCard h1{font-size:30px;line-height:1.25;text-align:center}
.joinCard .sub{text-align:center;color:#6b5d3a;margin:6px 0 20px;font-size:14px}
.row{display:flex;gap:10px;margin-bottom:12px}
.fld{flex:1;display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:#5b4d2b}
.fld select,.fld input[type=text]{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;width:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:#5b4d2b;margin:4px 0 16px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:17px;font-weight:700;background:var(--navy);color:#fff;
  box-shadow:0 4px 0 #071628;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #071628}
.btn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 4px 0 #9a6d0c}
.btn.green{background:var(--ok);box-shadow:0 4px 0 #106337}
.btn.gray{background:#8b97a5;box-shadow:0 4px 0 #56606c}
.btn.red{background:var(--red);box-shadow:0 4px 0 #8f2a21}
.btn.big{width:100%;font-size:20px;padding:14px}
.btn.sm{font-size:13px;padding:7px 11px;border-radius:10px;box-shadow:0 3px 0 #071628}
.mode{margin-top:14px;font-size:12.5px;padding:9px 12px;border-radius:10px;background:#fff3c9;color:#6b4e00;line-height:1.5}
.mode.on{background:#dff5e7;color:#0f5a31}

/* ---------- 게임 화면 ---------- */
#game{display:flex;gap:12px;padding:10px;min-height:100vh;align-items:flex-start;justify-content:center}
#board{position:relative;flex:none;width:var(--bs);height:var(--bs);background:var(--paper);border-radius:14px;
  border:3px solid var(--gold);box-shadow:0 14px 40px #0007;display:grid;
  grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;
  font-size:max(calc(var(--bs) / 74),5px);overflow:hidden}
.cell{position:relative;border:1px solid var(--line);background:#fffdf5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;cursor:pointer;line-height:1.1;padding:0 1px;min-width:0;min-height:0;overflow:hidden}
.cell:hover{filter:brightness(.96)}
.cell .band{position:absolute;left:0;right:0;top:0;height:14%}
.cell .em{font-size:2em;margin-top:.25em}
.cell .nm{font-weight:800;font-size:1.05em;word-break:keep-all}
.cell .pr{font-size:.95em;color:#7a6a45;font-weight:700}
.cell.sp{background:#fff3cf}
.cell.corner{background:#ffe9a8}
.cell.corner .em{font-size:3em}
.cell.corner .nm{font-size:1.25em}
.cell.owned{box-shadow:inset 0 0 0 .28em var(--oc)}
.cell.pick{animation:pick 1s infinite}
@keyframes pick{50%{box-shadow:inset 0 0 0 .3em #2f7df6}}
.t0{background:#f08a5d}.t1{background:#5bb5a2}.t2{background:#6a8fd8}.t3{background:#b877c9}
#center{grid-area:2/2/11/11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;padding:2em;
  background:
    radial-gradient(circle at 50% 50%,#ffffffcc 0,#fbf4e200 70%),
    repeating-linear-gradient(45deg,#f3e8c8 0 2px,transparent 2px 14px);text-align:center}
#center h2{font-size:3.4em;color:var(--navy);line-height:1.15}
#center .tag{font-size:1.4em;color:#7a6a45;font-weight:700}
#turnBox{font-size:1.9em;font-weight:800;padding:.4em 1em;border-radius:99px;background:#fff;border:.15em solid var(--line)}
#diceBox{display:flex;gap:1.4em}
.die{width:6.2em;height:6.2em;background:#fff;border-radius:1.1em;border:.2em solid var(--ink);display:grid;
  grid-template:repeat(3,1fr)/repeat(3,1fr);padding:.7em;box-shadow:0 .4em 0 #0003}
.die i{border-radius:50%;margin:12%}
.die i.on{background:var(--red)}
.die.shake{animation:shake .12s infinite}
@keyframes shake{25%{transform:rotate(-12deg) translateY(-.3em)}75%{transform:rotate(12deg) translateY(.3em)}}
#rollBtn{font-size:2.2em;padding:.5em 1.4em;border-radius:.7em}
#hintLine{font-size:1.45em;color:#5b4d2b;min-height:1.4em;font-weight:700}
#toks{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;width:2.9em;height:2.9em;margin:-1.45em 0 0 -1.45em;border-radius:50%;border:.25em solid #fff;
  box-shadow:0 .2em .5em #0007;color:#fff;font-weight:800;font-size:1em;display:flex;align-items:center;justify-content:center;
  transition:left .18s ease-out,top .18s ease-out;z-index:5}
.tok span{font-size:1.25em}
.tok.me{outline:.2em solid var(--gold)}
.tok.out{display:none}

#side{flex:1;min-width:270px;max-width:380px;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--paper);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px #0005}
.roomHd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.roomHd b{font-family:"Jua",sans-serif;font-weight:400;font-size:19px}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#fff3c9;color:#6b4e00;font-weight:700}
.badge.on{background:#dff5e7;color:#0f5a31}
.pl{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:11px;border:2px solid transparent;margin-top:6px;background:#fff}
.pl.turn{border-color:var(--gold);background:#fff8dd}
.pl.dead{opacity:.45}
.dot{width:26px;height:26px;border-radius:50%;flex:none;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.pl .nm{font-weight:800;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .nm small{font-weight:600;color:#7a6a45}
.pl .mn{font-weight:800;font-variant-numeric:tabular-nums}
.pl .st{font-size:12px;color:#7a6a45}
#log{font-size:12.5px;line-height:1.55;max-height:210px;overflow:auto;color:#3d3a30}
#log div{border-bottom:1px dashed #e2d6b2;padding:2px 0}
.potLine{font-size:13.5px;font-weight:700;color:#5b4d2b;margin-top:8px}

/* ---------- 교사 화면 ---------- */
#teacher{padding:12px;max-width:1300px;margin:0 auto}
.tBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tBar select{font:inherit;font-size:16px;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:#fff}
#tGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.tCard h3{font-size:20px;display:flex;align-items:center;justify-content:space-between}
.tCard .stt{font-family:inherit;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:#e7eef7;color:#234}
.tCard .stt.play{background:#dff5e7;color:#0f5a31}.tCard .stt.end{background:#fde4e1;color:#8f2a21}
.tCard .now{font-size:13px;color:#5b4d2b;font-weight:700;margin:6px 0 2px;min-height:18px}
.tCard .pl{padding:5px 8px;margin-top:4px}
.tCard .pl .mn small{display:block;font-weight:600;color:#7a6a45;font-size:11px;text-align:right}
.tCard .empty{font-size:13px;color:#7a6a45;padding:14px 0;text-align:center}
.tActs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tActs .btn{flex:1;white-space:nowrap}

/* ---------- 팝업 ---------- */
.ov{position:fixed;inset:0;background:#081a2ecc;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
#pop{z-index:60}
.card{background:var(--paper);border-radius:20px;width:min(560px,100%);max-height:94vh;overflow:auto;padding:20px 22px 22px;
  border:3px solid var(--gold);box-shadow:0 24px 70px #000a;animation:popin .22s ease-out}
@keyframes popin{from{transform:scale(.9);opacity:0}}
.who{font-size:13px;font-weight:800;padding:6px 12px;border-radius:99px;background:#e7eef7;color:#234;display:inline-block;margin-bottom:10px}
.who.mine{background:var(--gold);color:#3b2a00}
.cityHd{display:flex;align-items:center;gap:14px}
.cityHd .big{font-size:52px;line-height:1}
.cityHd h2{font-size:30px}
.cityHd .ct{font-size:14px;color:#7a6a45;font-weight:700}
.desc{margin:12px 0;line-height:1.6;font-size:15px}
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.prices div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;color:#7a6a45}
.prices b{display:block;font-size:15px;color:var(--ink)}
.prices .now{border:2px solid var(--gold);background:#fff8dd}
.qbox{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:13px 15px;margin-top:12px}
.qbox .ql{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.05em}
.qbox .qt{font-size:16.5px;font-weight:700;line-height:1.5;margin-top:4px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;font-size:15.5px;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:600;line-height:1.4;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--navy);background:#eef4fb}
.opt:disabled{opacity:1}
.opt.x{background:#fde4e1;border-color:var(--red);color:#8f2a21;text-decoration:line-through}
.opt.o{background:#dff5e7;border-color:var(--ok);color:#0f5a31}
.note{border-radius:12px;padding:11px 14px;margin-top:12px;font-size:14.5px;line-height:1.55}
.note.hint{background:#fff3c9;border:2px dashed var(--gold)}
.note.good{background:#dff5e7;border:2px solid var(--ok)}
.note.bad{background:#fde4e1;border:2px solid var(--red)}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:130px}
.msg{font-size:17px;line-height:1.65;margin:14px 0 2px;white-space:pre-line}
.center{text-align:center}
.bigEm{font-size:64px;line-height:1.1}
.rank{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:800}
.rank .no{font-family:"Jua",sans-serif;font-size:22px;width:34px;text-align:center}
.rank .as{margin-left:auto;font-variant-numeric:tabular-nums}
.kick{border:0;background:#eee;border-radius:8px;padding:3px 8px;font-size:12px}
.menuList{display:grid;gap:9px;margin-top:14px}

@media (max-width:820px),(max-aspect-ratio:1/1){
  :root{--bs:calc(100vw - 16px)}
  #game{flex-direction:column;align-items:center;padding:8px}
  #side{max-width:none;width:100%}
}
@media (prefers-reduced-motion:reduce){.tok{transition:none}.die.shake,.cell.pick,.card{animation:none}}
</style>
</head>
<body>

<!-- ===================== 입장 화면 ===================== -->
<div id="join">
  <div class="joinCard">
    <h1>🌍 인체 탐험<br>세계 일주 부루마블</h1>
    <div class="sub">중2 과학 · 동물과 에너지 (소화 · 순환 · 호흡 · 배설)</div>
    <div class="row">
      <label class="fld">반<select id="selCls"></select></label>
      <label class="fld">모둠<select id="selGrp"></select></label>
    </div>
    <div class="row">
      <label class="fld">이름<input type="text" id="inpName" maxlength="8" placeholder="이름을 입력하세요"></label>
    </div>
    <button class="btn gold big" id="btnJoin" style="margin-top:6px">모둠 입장하기</button>
    <button class="btn gray big" id="btnTeacher" style="margin-top:12px;font-size:16px;padding:10px">👩‍🏫 교사 모드</button>
    <div class="mode" id="modeBox"></div>
  </div>
</div>

<!-- ===================== 교사 화면 ===================== -->
<div id="teacher" class="hidden">
  <div class="tBar panel">
    <b class="jua" style="font-size:22px">👩‍🏫 교사 모드</b>
    <select id="tCls"></select>
    <span class="badge" id="tNet"></span>
    <span style="flex:1"></span>
    <button class="btn sm red" id="tResetAll">🔄 전체 모둠 다시 시작</button>
    <button class="btn sm" id="tEndAll">🏁 전체 모둠 게임 끝내기</button>
    <button class="btn sm gray" id="tExit">나가기</button>
  </div>
  <div id="tGrid"></div>
</div>

<!-- ===================== 게임 화면 ===================== -->
<div id="game" class="hidden">
  <div id="board">
    <div id="center">
      <h2>🌍 인체 탐험 세계 일주</h2>
      <div class="tag">문제를 맞혀 도시를 사고, 건물을 지어 보세요!</div>
      <div id="turnBox">-</div>
      <div id="diceBox"><div class="die" id="die1"></div><div class="die" id="die2"></div></div>
      <button class="btn gold" id="rollBtn">🎲 주사위 굴리기</button>
      <div id="hintLine"></div>
    </div>
    <div id="toks"></div>
  </div>
  <div id="side">
    <div class="panel">
      <div class="roomHd"><b id="roomName"></b><span><span class="badge" id="netBadge"></span>
        <button class="btn sm red" id="btnRestart">🔄 다시 시작</button> <button class="btn sm" id="btnMenu">☰ 메뉴</button></span></div>
      <button class="btn sm gold hidden" id="btnBackT" style="margin-top:8px;width:100%">← 교사 화면으로 돌아가기</button>
      <div id="players"></div>
      <div class="potLine" id="potLine"></div>
    </div>
    <div class="panel"><b style="font-size:13px">📜 진행 기록</b><div id="log"></div></div>
  </div>
</div>

<div class="ov hidden" id="modal"><div class="card" id="modalCard"></div></div>
<div class="ov hidden" id="pop"><div class="card" id="popCard"></div></div>

 {n:"베이징",k:"중국",e:"🏯",d:"중국의 수도로 자금성과 만리장성이 있는 역사 도시입니다. 기름진 오리구이 '베이징 덕'이 대표 음식이에요.",q:[
  {q:"기름진 베이징 덕에는 지방이 많습니다. 지방의 소화를 돕는 쓸개즙이 만들어지는 기관은?",o:["간","쓸개","이자","위"],h:"쓸개는 쓸개즙을 '저장'만 하는 곳이에요. 만드는 곳은 우리 몸에서 가장 큰 장기!",x:"쓸개즙은 간에서 만들어져 쓸개에 저장되었다가 소장으로 분비됩니다."},
  {q:"오리구이의 기름에 지방이 들어 있는지 확인하려고 합니다. 알맞은 검출 용액과 색깔 변화는?",o:["수단 Ⅲ 용액 → 선홍색","아이오딘-아이오딘화 칼륨 용액 → 청람색","베네딕트 용액 → 황적색","뷰렛 용액 → 보라색"],h:"지방과 만나면 선명한 붉은색(선홍색)이 되는 용액이에요.",x:"지방은 수단 Ⅲ 용액과 반응하여 선홍색을 띱니다."}]},
 {n:"마닐라",k:"필리핀",e:"🥭",d:"필리핀의 수도로 7,000개가 넘는 섬나라의 중심 도시입니다. 달콤한 망고와 바나나 같은 열대 과일이 풍부해요.",q:[
  {q:"달콤한 망고에는 포도당이 들어 있습니다. 포도당을 확인하려면 어떤 용액을 넣고 어떻게 해야 할까요?",o:["베네딕트 용액을 넣고 가열한다 → 황적색","뷰렛 용액을 넣는다 → 보라색","수단 Ⅲ 용액을 넣는다 → 선홍색","아이오딘-아이오딘화 칼륨 용액을 넣는다 → 청람색"],h:"이 용액은 넣은 뒤 반드시 '가열'해야 색이 변해요.",x:"포도당, 엿당 등은 베네딕트 용액을 넣고 가열하면 황적색으로 변합니다."},
  {q:"탄수화물, 단백질, 지방 중 1 g당 가장 많은 에너지(약 9 kcal)를 내는 영양소는?",o:["지방","탄수화물","단백질","세 영양소 모두 같다"],h:"탄수화물과 단백질은 1 g당 약 4 kcal를 내요.",x:"지방은 1 g당 약 9 kcal로, 3대 영양소 중 가장 많은 에너지를 냅니다."}]},
 {n:"제주",k:"대한민국",e:"🍊",d:"한라산과 푸른 바다가 아름다운 우리나라 최대의 섬입니다. 숨을 참고 바닷속에서 해산물을 캐는 제주 해녀 문화는 유네스코 인류무형문화유산이에요.",q:[
  {q:"물 위로 올라온 해녀가 숨을 크게 들이쉴 때(들숨), 갈비뼈와 가로막의 움직임은?",o:["갈비뼈는 올라가고, 가로막은 내려간다","갈비뼈는 내려가고, 가로막은 올라간다","갈비뼈와 가로막이 모두 올라간다","갈비뼈와 가로막이 모두 내려간다"],h:"숨을 들이쉬려면 가슴 속 공간(흉강)이 넓어져야 해요.",x:"들숨 때 갈비뼈가 올라가고 가로막이 내려가 흉강이 넓어지면서 공기가 폐로 들어옵니다."},
  {q:"해녀의 폐는 스스로 커지거나 작아지지 못합니다. 그 까닭은?",o:["폐에는 근육이 없기 때문에","폐가 뼈로 되어 있기 때문에","폐에 혈관이 없기 때문에","폐가 너무 무겁기 때문에"],h:"그래서 폐는 갈비뼈와 가로막의 움직임에 따라 크기가 변해요.",x:"폐는 근육이 없어 스스로 운동하지 못하고, 갈비뼈와 가로막의 움직임으로 호흡 운동이 일어납니다."}]},
 {n:"싱가포르",k:"싱가포르",e:"🦁",d:"적도 근처에 있어 1년 내내 더운 도시 국가입니다. 입에서 물을 뿜는 머라이언 동상이 상징이에요.",q:[
  {q:"더운 싱가포르에서는 물을 자주 마셔야 합니다. 우리 몸을 구성하는 성분 중 가장 많은 양을 차지하는 것은?",o:["물","단백질","지방","탄수화물"],h:"우리 몸의 약 60~70 %를 차지하고, 영양소와 노폐물을 운반해요.",x:"물은 우리 몸에서 가장 많은 성분으로, 물질 운반과 체온 조절을 돕습니다."},
  {q:"혈액 속 노폐물(요소 등)을 걸러 오줌을 만드는 배설 기관은?",o:["콩팥","방광","간","대장"],h:"강낭콩 모양으로, 허리 뒤쪽에 좌우 한 쌍이 있어요.",x:"콩팥은 혈액 속 노폐물을 걸러 오줌을 만드는 기관입니다."}]},
 {n:"카이로",k:"이집트",e:"🐫",d:"나일강이 흐르는 이집트의 수도로 가까이에 피라미드와 스핑크스가 있습니다. 고대 이집트인들은 미라를 만들 때 심장만은 몸속에 남겨 두었다고 해요.",q:[
  {q:"고대 이집트인들이 소중히 여긴 심장! 사람의 심장은 몇 개의 방으로 이루어져 있을까요?",o:["2심방 2심실","1심방 1심실","1심방 2심실","2심방 1심실"],h:"혈액을 받아들이는 곳 2개, 내보내는 곳 2개로 모두 4개의 방이에요.",x:"사람의 심장은 2개의 심방과 2개의 심실로 이루어져 있습니다."},
  {q:"심장의 네 방 중 온몸으로 혈액을 내보내기 때문에 근육 벽이 가장 두꺼운 곳은?",o:["좌심실","우심실","좌심방","우심방"],h:"대동맥과 연결된 방이에요.",x:"좌심실은 온몸으로 혈액을 내보내야 하므로 근육이 가장 두껍습니다."}]},
 {n:"이스탄불",k:"튀르키예",e:"🕌",d:"유럽과 아시아 두 대륙에 걸쳐 있는 도시입니다. 고기를 꼬챙이에 꿰어 구운 케밥이 세계적으로 유명해요.",q:[
  {q:"케밥의 고기에는 단백질이 많습니다. 위에서 단백질을 분해하는 소화 효소는?",o:["펩신","아밀레이스","라이페이스","쓸개즙"],h:"위액 속에 들어 있고, 염산의 도움을 받아 작용해요.",x:"위액 속의 펩신은 염산의 도움을 받아 단백질을 분해합니다."},
  {q:"케밥 고기에 단백질이 들어 있는지 확인하려고 뷰렛 용액(5 % 수산화 나트륨 수용액 + 1 % 황산 구리 수용액)을 넣었습니다. 어떤 색으로 변할까요?",o:["보라색","청람색","황적색","선홍색"],h:"포도 색깔을 떠올려 보세요.",x:"단백질은 뷰렛 용액과 반응하여 보라색을 띱니다."}]},
 {n:"아테네",k:"그리스",e:"🏛️",d:"파르테논 신전이 있는 그리스의 수도이자 올림픽의 고향입니다. 마라톤 경기는 고대 그리스의 전령이 승전 소식을 전하러 달렸다는 이야기에서 유래했어요.",q:[
  {q:"마라톤 선수의 세포에서 영양소가 산소와 반응하여 에너지를 얻는 과정을 무엇이라고 할까요?",o:["세포 호흡","소화","배설","흡수"],h:"'세포'에서 일어나는 '호흡'이에요.",x:"세포 호흡: 영양소 + 산소 → 이산화 탄소 + 물 + 에너지"},
  {q:"그리스 요리에 듬뿍 쓰이는 올리브유는 지방입니다. 이자액에 들어 있는 지방 분해 효소는?",o:["라이페이스","트립신","펩신","아밀레이스"],h:"지방을 지방산과 모노글리세리드로 분해하는 효소예요.",x:"이자액의 라이페이스는 지방을 지방산과 모노글리세리드로 분해합니다."}]},
 {n:"코펜하겐",k:"덴마크",e:"🚲",d:"덴마크의 수도로 인어공주 동상이 있는 동화의 도시입니다. 시민 대부분이 자전거로 출퇴근하는 '자전거 천국'이에요.",q:[
  {q:"자전거를 열심히 타면 심장이 빨리 뛰고 숨이 가빠집니다. 그 까닭으로 가장 알맞은 것은?",o:["세포에 산소와 영양소를 더 많이 공급하기 위해","몸속의 혈액 양을 줄이기 위해","소화 효소를 더 많이 만들기 위해","오줌을 더 많이 만들기 위해"],h:"운동을 하면 세포 호흡이 활발해져 에너지가 많이 필요해요.",x:"운동할 때는 세포 호흡에 필요한 산소와 영양소를 빨리 공급하기 위해 심장 박동과 호흡이 빨라집니다."},
  {q:"자전거를 탄 뒤 손목에 손가락을 대면 맥박이 느껴집니다. 심장에서 나온 혈액이 흘러 맥박이 나타나는 혈관은?",o:["동맥","정맥","모세 혈관","암죽관"],h:"혈압이 가장 높고, 벽이 두껍고 탄력이 있는 혈관이에요.",x:"동맥은 심장에서 나가는 혈액이 흐르는 혈관으로, 심장 박동에 따라 맥박이 나타납니다."}]},
 {n:"스톡홀름",k:"스웨덴",e:"🏅",d:"스웨덴의 수도로 매년 12월 노벨상 시상식이 열립니다. 노벨 생리의학상은 우리 몸과 질병의 비밀을 밝힌 과학자에게 주는 상이에요.",q:[
  {q:"혈액의 성분 중 몸속에 들어온 세균을 잡아먹어(식균 작용) 우리 몸을 지키는 것은?",o:["백혈구","적혈구","혈소판","혈장"],h:"핵이 있고, 모양이 일정하지 않은 혈구예요.",x:"백혈구는 식균 작용으로 몸에 침입한 세균을 없앱니다."},
  {q:"상처가 났을 때 혈액을 굳게 하여(혈액 응고) 출혈을 막는 혈액 성분은?",o:["혈소판","백혈구","적혈구","혈장"],h:"혈구 중 크기가 가장 작고 핵이 없어요.",x:"혈소판은 상처 부위의 혈액을 응고시켜 출혈을 막습니다."}]},
 {n:"암스테르담",k:"네덜란드",e:"🌷",d:"운하와 풍차, 튤립으로 유명한 네덜란드의 수도입니다. 네덜란드는 맛있는 치즈로도 세계적으로 유명해요.",q:[
  {q:"치즈에는 단백질이 풍부합니다. 단백질이 소화되어 최종적으로 분해된 물질은?",o:["아미노산","포도당","지방산","엿당"],h:"이 물질이 여러 개 연결되면 단백질이 돼요.",x:"단백질은 펩신, 트립신 등의 작용으로 최종적으로 아미노산으로 분해됩니다."},
  {q:"단백질이 분해되어 생긴 아미노산은 소장 융털의 어느 곳으로 흡수될까요?",o:["모세 혈관","암죽관","쓸개","대장"],h:"아미노산과 포도당은 물에 잘 녹는 영양소예요.",x:"물에 잘 녹는 포도당, 아미노산, 무기염류 등은 융털의 모세 혈관으로 흡수됩니다."}]},
 {n:"취리히",k:"스위스",e:"🏔️",d:"스위스에서 가장 큰 도시로, 만년설이 덮인 알프스 산맥과 가깝습니다. 높은 산에 오르면 공기 중 산소가 부족해 숨이 차요.",q:[
  {q:"알프스처럼 높은 곳에서는 산소가 부족합니다. 혈액에서 산소를 운반하는 성분은?",o:["적혈구","백혈구","혈소판","혈장"],h:"가운데가 오목한 원반 모양이고 붉은색을 띠어요.",x:"적혈구는 헤모글로빈을 가지고 있어 산소를 운반합니다."},
  {q:"적혈구가 붉은색을 띠고 산소를 운반할 수 있는 것은 어떤 물질이 들어 있기 때문일까요?",o:["헤모글로빈","아밀레이스","요소","쓸개즙"],h:"산소가 많은 곳에서는 산소와 결합하고, 적은 곳에서는 산소를 내놓는 붉은 색소예요.",x:"헤모글로빈은 적혈구 속의 붉은 색소로 산소와 결합하여 산소를 운반합니다."}]},
 {n:"베를린",k:"독일",e:"🥨",d:"독일의 수도로 브란덴부르크 문과 베를린 장벽 유적이 있습니다. 소시지에 카레 소스를 뿌린 '커리부어스트'가 인기 간식이에요.",q:[
  {q:"소시지의 지방이 분해되어 생긴 지방산과 모노글리세리드는 소장 융털의 어느 곳으로 흡수될까요?",o:["암죽관","모세 혈관","사구체","폐포"],h:"물에 잘 녹지 않는 영양소가 흡수되는, 융털 가운데의 관이에요.",x:"지방산, 모노글리세리드 등 물에 잘 녹지 않는 영양소는 융털의 암죽관으로 흡수됩니다."},
  {q:"소장 안쪽 벽에는 융털이 수없이 많이 나 있습니다. 융털이 있어서 좋은 점은?",o:["영양소와 닿는 표면적이 넓어져 흡수가 잘 된다","음식물이 빨리 지나가게 해 준다","소화 효소가 필요 없게 해 준다","세균을 잡아먹는다"],h:"주름이 많으면 닿는 넓이가 어떻게 될까요?",x:"융털은 소장 안쪽 벽의 표면적을 넓혀 영양소를 효율적으로 흡수하게 합니다."}]},
 {n:"모스크바",k:"러시아",e:"❄️",d:"러시아의 수도로 붉은 광장과 알록달록한 성 바실리 대성당이 유명합니다. 겨울에는 영하 20 ℃ 아래로 내려갈 만큼 추워요.",q:[
  {q:"추운 모스크바에서도 체온은 일정하게 유지됩니다. 체온 유지에 쓰이는 에너지는 어떤 과정으로 얻을까요?",o:["세포 호흡","배설","혈액 응고","식균 작용"],h:"세포에서 영양소와 산소가 반응하는 과정이에요.",x:"세포 호흡으로 얻은 에너지는 체온 유지, 근육 운동, 두뇌 활동 등에 쓰입니다."},
  {q:"차가운 공기를 들이마셨을 때, 공기가 폐포까지 이동하는 경로로 옳은 것은?",o:["코 → 기관 → 기관지 → 폐포","코 → 기관지 → 기관 → 폐포","코 → 식도 → 기관 → 폐포","코 → 기관 → 폐포 → 기관지"],h:"'기관'이 두 갈래로 갈라진 것이 '기관지'예요.",x:"공기는 코 → 기관 → 기관지 → 폐(폐포) 순서로 이동합니다."}]},
 {n:"부에노스아이레스",sn:"부에노스<br>아이레스",k:"아르헨티나",e:"💃",d:"열정적인 춤 탱고가 태어난 아르헨티나의 수도입니다. 숯불에 소고기를 굽는 '아사도'를 즐겨 먹어요.",q:[
  {q:"소고기의 단백질이 세포에서 분해될 때는 탄수화물, 지방과 달리 질소가 포함된 노폐물이 생깁니다. 이 노폐물은?",o:["암모니아","이산화 탄소","물","산소"],h:"독성이 강해서 간에서 요소로 바뀌는 물질이에요.",x:"단백질이 분해되면 이산화 탄소, 물과 함께 암모니아가 생깁니다."},
  {q:"독성이 강한 암모니아를 독성이 약한 요소로 바꾸어 주는 기관은?",o:["간","콩팥","방광","이자"],h:"쓸개즙도 만드는, 우리 몸의 화학 공장이에요.",x:"암모니아는 간에서 요소로 바뀐 뒤 콩팥에서 걸러져 오줌으로 나갑니다."}]},
 {n:"리우데자네이루",sn:"리우데<br>자네이루",k:"브라질",e:"⚽",d:"거대한 예수상과 삼바 카니발로 유명한 브라질의 항구 도시입니다. 해변에서 축구를 즐기는 사람들을 쉽게 볼 수 있어요.",q:[
  {q:"축구 선수가 내쉬는 숨(날숨)에는 들이쉬는 숨(들숨)보다 어떤 기체가 더 많이 들어 있을까요?",o:["이산화 탄소","산소","질소","수소"],h:"세포 호흡 결과 만들어지는 기체예요.",x:"세포 호흡으로 생긴 이산화 탄소가 폐에서 날숨으로 나가므로 날숨에는 이산화 탄소가 더 많습니다."},
  {q:"폐포와 모세 혈관 사이에서 산소와 이산화 탄소가 교환되는 원리는?",o:["기체의 농도 차이에 따른 확산","근육의 수축 운동","소화 효소의 작용","심장의 박동"],h:"기체는 농도가 높은 곳에서 낮은 곳으로 퍼져 나가요.",x:"기체 교환은 기체의 농도 차이에 따른 확산으로 일어납니다."}]},
 {n:"시드니",k:"호주",e:"🦘",d:"조개껍데기 모양의 오페라 하우스로 유명한 호주 최대의 도시입니다. 아름다운 해변에서 서핑을 즐길 수 있어요.",q:[
  {q:"콩팥에서 오줌을 만드는 기본 단위인 네프론은 무엇으로 이루어져 있을까요?",o:["사구체, 보먼주머니, 세뇨관","방광, 요도, 오줌관","심방, 심실, 판막","기관, 기관지, 폐포"],h:"모세 혈관 덩어리 + 그것을 감싼 주머니 + 가늘고 긴 관",x:"네프론은 사구체, 보먼주머니, 세뇨관으로 이루어져 있습니다."},
  {q:"건강한 사람의 사구체에서 보먼주머니로 여과되지 않는 물질은?",o:["단백질","포도당","요소","물"],h:"크기가 커서 사구체의 혈관 벽을 빠져나가지 못해요.",x:"혈구나 단백질처럼 크기가 큰 물질은 여과되지 않습니다."}]},
 {n:"부산",k:"대한민국",e:"🌊",d:"해운대 해수욕장과 광안대교가 있는 우리나라 제2의 도시입니다. 자갈치 시장에서는 싱싱한 생선을 맛볼 수 있어요.",q:[
  {q:"생선의 단백질은 소장에서도 분해됩니다. 이자액에 들어 있는 단백질 분해 효소는?",o:["트립신","펩신","라이페이스","아밀레이스"],h:"펩신은 '위액'에 들어 있어요. '이자액' 속의 단백질 분해 효소를 찾아보세요.",x:"이자액의 트립신은 소장에서 단백질을 분해합니다."},
  {q:"녹말, 단백질, 지방을 분해하는 소화 효소가 모두 들어 있는 소화액은?",o:["이자액","침","위액","쓸개즙"],h:"아밀레이스, 트립신, 라이페이스가 모두 들어 있어요.",x:"이자액에는 아밀레이스, 트립신, 라이페이스가 모두 들어 있습니다."}]},
 {n:"호놀룰루",k:"미국 하와이",e:"🌺",d:"와이키키 해변이 있는 하와이의 중심 도시입니다. 맑은 바다에서 스노클링을 하며 열대어를 볼 수 있어요.",q:[
  {q:"스노클링을 하며 들이마신 공기가 도착하는, 폐를 이루는 수많은 작은 공기주머니는?",o:["폐포","융털","네프론","사구체"],h:"표면을 모세 혈관이 둘러싸고 있어 기체 교환이 일어나요.",x:"폐는 수많은 폐포로 이루어져 공기와 닿는 표면적이 넓어 기체 교환이 효율적입니다."},
  {q:"폐포에서 모세 혈관 속 혈액으로 이동하는 기체는?",o:["산소","이산화 탄소","질소","암모니아"],h:"세포 호흡에 꼭 필요한 기체예요.",x:"산소는 폐포 → 모세 혈관, 이산화 탄소는 모세 혈관 → 폐포로 이동합니다."}]},
 {n:"리스본",k:"포르투갈",e:"⛵",d:"대항해 시대에 탐험선들이 출발하던 포르투갈의 수도입니다. 긴 항해 동안 신선한 과일과 채소를 먹지 못한 선원들은 잇몸에서 피가 나는 괴혈병에 걸리곤 했어요.",q:[
  {q:"대항해 시대 선원들의 괴혈병은 어떤 영양소가 부족해서 생겼을까요?",o:["바이타민 C","탄수화물","지방","단백질"],h:"귤, 레몬 같은 신선한 과일과 채소에 많이 들어 있어요.",x:"바이타민은 적은 양으로 몸의 기능을 조절하며, 바이타민 C가 부족하면 괴혈병에 걸립니다."},
  {q:"리스본의 명물 에그타르트에는 달걀이 듬뿍 들어갑니다. 달걀에 풍부하며 근육, 머리카락 등 우리 몸을 구성하는 주된 영양소는?",o:["단백질","녹말","바이타민","물"],h:"에너지원으로도 쓰이고, 몸을 구성하는 주요 성분이에요.",x:"단백질은 몸을 구성하는 주요 성분이며 에너지원으로도 쓰입니다."}]},
 {n:"마드리드",k:"스페인",e:"🎸",d:"스페인의 수도로 세계적인 프라도 미술관이 있습니다. 밀가루 반죽을 튀긴 추로스를 초콜릿에 찍어 먹는 간식이 유명해요.",q:[
  {q:"추로스의 밀가루에 들어 있는 녹말은 소화 과정을 거쳐 최종적으로 무엇으로 분해될까요?",o:["포도당","아미노산","지방산","모노글리세리드"],h:"녹말 → 엿당 → ( ? ) 순서로 분해돼요.",x:"녹말은 아밀레이스에 의해 엿당으로, 소장에서 최종적으로 포도당으로 분해됩니다."},
  {q:"추로스를 먹었을 때 음식물이 지나가는 소화관의 순서로 옳은 것은?",o:["입 → 식도 → 위 → 소장 → 대장 → 항문","입 → 위 → 식도 → 소장 → 대장 → 항문","입 → 식도 → 소장 → 위 → 대장 → 항문","입 → 식도 → 위 → 대장 → 소장 → 항문"],h:"식도를 지나 위로, 그다음은 영양소를 흡수하는 긴 소장이에요.",x:"음식물은 입 → 식도 → 위 → 소장 → 대장 → 항문 순서로 이동합니다."}]},
 {n:"멕시코시티",k:"멕시코",e:"🌮",d:"해발 약 2,240 m 고원에 자리한 멕시코의 수도입니다. 옥수수로 만든 토르티야에 고기와 채소를 싸 먹는 타코가 유명해요.",q:[
  {q:"옥수수 토르티야에 풍부한 영양소로, 우리 몸에서 주된 에너지원으로 쓰이는 것은?",o:["탄수화물","무기염류","바이타민","물"],h:"밥, 빵, 국수, 옥수수에 많이 들어 있어요.",x:"탄수화물은 우리 몸의 주된 에너지원으로 1 g당 약 4 kcal의 에너지를 냅니다."},
  {q:"매콤한 타코가 위에 도착하면 위액이 분비됩니다. 위액 속 염산의 역할로 옳은 것은?",o:["펩신의 작용을 돕고, 음식물 속 세균을 죽인다","녹말을 엿당으로 분해한다","지방을 작은 덩어리로 쪼갠다","영양소를 흡수한다"],h:"염산은 강한 산성 물질이에요. 살균 작용을 해요.",x:"염산은 펩신의 작용을 돕고 살균 작용을 합니다."}]},
 {n:"도쿄",k:"일본",e:"🗼",d:"일본의 수도로 도쿄 타워와 스카이트리가 솟아 있습니다. 밥 위에 생선을 올린 초밥(스시)이 대표 음식이에요.",q:[
  {q:"초밥의 밥을 오래 씹으면 단맛이 납니다. 침 속 아밀레이스가 녹말을 무엇으로 분해했기 때문일까요?",o:["엿당","아미노산","지방산","요소"],h:"'엿'처럼 단맛이 나는 당이에요.",x:"아밀레이스는 녹말을 단맛이 나는 엿당으로 분해합니다."},
  {q:"초밥을 먹으면 소화가 일어납니다. '소화'의 뜻으로 가장 알맞은 것은?",o:["크기가 큰 영양소를 흡수할 수 있도록 작게 분해하는 과정","영양소로 에너지를 만드는 과정","노폐물을 몸 밖으로 내보내는 과정","혈액을 온몸으로 보내는 과정"],h:"녹말, 단백질, 지방은 크기가 커서 그대로는 세포막을 통과하지 못해요.",x:"소화는 큰 영양소를 체내로 흡수할 수 있는 작은 크기로 분해하는 과정입니다."}]},
 {n:"토론토",k:"캐나다",e:"🍁",d:"CN 타워가 우뚝 솟은 캐나다 최대의 도시입니다. 단풍나무 수액으로 만든 메이플 시럽과 아이스하키가 유명해요.",q:[
  {q:"아이스하키 선수의 심장은 힘차게 뜁니다. 심장과 정맥에 있는 '판막'의 역할은?",o:["혈액이 거꾸로 흐르는 것을 막는다","혈액 속 세균을 잡아먹는다","산소를 운반한다","혈액을 굳게 한다"],h:"한쪽 방향으로만 열리는 문과 같아요.",x:"판막은 혈액이 거꾸로 흐르는 것을 막아 한 방향으로 흐르게 합니다."},
  {q:"혈액의 액체 성분으로, 대부분이 물이며 영양소와 노폐물 등을 운반하는 것은?",o:["혈장","적혈구","백혈구","혈소판"],h:"혈액을 가만히 두면 위쪽에 뜨는 옅은 노란색 액체예요.",x:"혈장은 영양소, 이산화 탄소, 노폐물 등을 운반합니다."}]},
 {n:"파리",k:"프랑스",e:"🥐",d:"에펠탑과 루브르 박물관이 있는 프랑스의 수도입니다. 버터가 듬뿍 들어간 크루아상과 바게트의 고향이에요.",q:[
  {q:"심장에서 나온 혈액이 폐를 거쳐 다시 심장으로 돌아오는 '폐순환'의 경로로 옳은 것은?",o:["우심실 → 폐동맥 → 폐 → 폐정맥 → 좌심방","좌심실 → 대동맥 → 온몸 → 대정맥 → 우심방","우심실 → 폐정맥 → 폐 → 폐동맥 → 좌심방","좌심실 → 폐동맥 → 폐 → 폐정맥 → 우심방"],h:"심장에서 '나가는' 혈관은 동맥! 폐순환은 '우심실'에서 출발해요.",x:"폐순환: 우심실 → 폐동맥 → 폐의 모세 혈관 → 폐정맥 → 좌심방"},
  {q:"크루아상의 버터(지방)는 소화되어 최종적으로 무엇으로 분해될까요?",o:["지방산과 모노글리세리드","포도당","아미노산","엿당"],h:"라이페이스가 지방을 두 가지 물질로 분해해요.",x:"지방은 라이페이스에 의해 지방산과 모노글리세리드로 분해됩니다."}]},
 {n:"로마",k:"이탈리아",e:"🍕",d:"콜로세움이 있는 이탈리아의 수도입니다. '모든 길은 로마로 통한다'는 말처럼, 우리 몸의 모든 혈액은 심장으로 돌아와요.",q:[

const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function fresh(){return {status:"lobby",players:{},order:[],turn:0,own:{},pot:0,phase:"roll",ctx:null,log:[],anim:{n:0},ql:{},again:false};}
function norm(s){ if(!s||typeof s!=="object")return fresh();
  s.players=s.players||{}; s.order=s.order?Object.values(s.order):[]; s.own=s.own||{}; s.log=s.log?Object.values(s.log):[];
  s.anim=s.anim||{n:0}; s.ql=s.ql||{}; s.pot=s.pot||0; s.turn=s.turn||0; s.status=s.status||"lobby"; s.phase=s.phase||"roll";
  s.order=s.order.filter(id=>s.players[id]); for(const id in s.players)s.players[id].id=id; return s;}
function cur(s){return s.players[s.order[s.turn]];}
function addLog(s,t){s.log.push(t); if(s.log.length>40)s.log=s.log.slice(-40);}
function invested(s,k){const o=s.own[k]; if(!o)return 0; let v=0; for(let i=0;i<=o.lv;i++)v+=BOARD[k].c.cost[i]; return v;}
function tollOf(s,k){return Math.round(invested(s,k)*0.5/10)*10;}
function assets(s,p){let v=p.money; for(const k in s.own) if(s.own[k].o===p.id) v+=invested(s,k); return v;}
function info(s,e,title,msg){s.phase="info"; s.ctx={e,title,msg};}

/* p 가 amt 를 지불 (to 가 있으면 그 사람에게). 돈이 모자라면 가진 땅을 은행에 반값으로 자동 매각, 그래도 모자라면 파산 */
function charge(s,p,amt,to){ let note="";
  if(p.money<amt){ const mine=Object.keys(s.own).filter(k=>s.own[k].o===p.id).sort((a,b)=>invested(s,a)-invested(s,b));
    for(const k of mine){ if(p.money>=amt)break; const v=Math.round(invested(s,k)/2); p.money+=v; delete s.own[k];
      note+=`\n🏦 ${BOARD[k].c.n}을(를) 은행에 팔았습니다 (+$${v})`; } }
  const paid=Math.min(p.money,amt); p.money-=paid; if(to)to.money+=paid;
  if(paid<amt){ p.out=true; p.money=0; note+=`\n💥 ${p.name} 파산!`; addLog(s,`💥 ${p.name} 파산`); }
  return {paid,note};}
function move(s,p,n){ if(p.pos+n>=40){p.money+=SALARY; addLog(s,`💵 ${p.name} 월급 $${SALARY}`);} p.pos=(p.pos+n)%40; }
function land(s,p){ const k=p.pos, sq=BOARD[k];
  if(sq.t==="city"){ const o=s.own[k];
    if(!o){ const last=s.ql[k]; const qi=(last==null)?rnd(sq.c.q.length):(last+1)%sq.c.q.length; s.ql[k]=qi;
      s.phase="quiz"; s.ctx={sq:k,qi,ord:shuffle([0,1,2,3]),tries:0,wrong:[],st:"ask"}; }
    else if(o.o===p.id){ if(o.lv<3){s.phase="build"; s.ctx={sq:k};} else info(s,"🏨",sq.c.n,"내 호텔에 도착했습니다. 편히 쉬어 가세요!"); }
    else { const ow=s.players[o.o], t=tollOf(s,k), r=charge(s,p,t,ow);
      addLog(s,`💸 ${p.name} → ${ow.name} 통행료 $${r.paid}`);
      info(s,"💸",`${sq.c.n} 통행료`,`${ow.name}의 ${LV_NAME[o.lv]}입니다.\n통행료 $${t} 중 $${r.paid}을(를) 지불했습니다.${r.note}`); } }
  else if(sq.t==="key"){ s.phase="key"; s.ctx={k:rnd(KEYS.length)}; }
  else if(sq.t==="start"){ info(s,"🚩","출발지 도착","출발지에 도착했습니다!\n월급 $"+SALARY+"을 받았습니다."); }
  else if(sq.t==="island"){ p.isl=3; addLog(s,`🏝️ ${p.name} 무인도 도착`); info(s,"🏝️","무인도","무인도에 갇혔습니다!\n3번의 차례 동안 주사위 더블(같은 눈)이 나와야 탈출할 수 있습니다."); }
  else if(sq.t==="fundget"){ const a=s.pot; p.money+=a; s.pot=0; if(a)addLog(s,`🎁 ${p.name} 사회복지기금 $${a} 수령`);
    info(s,"🎁","사회복지기금 받는 곳",a?`모여 있던 사회복지기금 $${a}을 받았습니다!`:"아직 모인 기금이 없습니다."); }
  else if(sq.t==="fundpay"){ const r=charge(s,p,FUND_FEE,null); s.pot+=r.paid; addLog(s,`💰 ${p.name} 사회복지기금 $${r.paid} 납부`);
    info(s,"💰","사회복지기금",`사회복지기금 $${FUND_FEE}을 냈습니다.\n(모인 기금은 '받는 곳'에 도착한 사람이 가져갑니다)${r.note}`); }
  else if(sq.t==="space"){ p.space=true; addLog(s,`🚀 ${p.name} 우주여행 탑승`); info(s,"🚀","우주여행","우주 왕복선에 탑승했습니다!\n다음 차례에 원하는 칸으로 날아갈 수 있습니다."); }
}
function checkEnd(s){ const alive=s.order.filter(id=>!s.players[id].out);
  if(alive.length===0||(s.order.length>=2&&alive.length<=1)){s.status="end"; s.phase="roll"; s.ctx=null; return true;} return false;}
function endTurn(s){ if(checkEnd(s))return; const p=cur(s);
  if(s.again&&!p.out&&!(p.isl>0)){ s.again=false; s.phase="roll"; s.ctx=null; addLog(s,`🎲 ${p.name} 더블! 한 번 더`); return; }
  s.again=false; p.dbl=0;
  do{ s.turn=(s.turn+1)%s.order.length; }while(cur(s).out);
  s.phase="roll"; s.ctx=null; }

/* ---- 행동(액션) : 조건이 맞지 않으면 false 를 돌려주어 취소 ---- */
function myTurn(s,uid){return s.status==="play"&&s.order[s.turn]===uid;}
function A_join(s,uid,name){ if(s.players[uid]){s.players[uid].name=name;return;}
  const same=Object.values(s.players).find(p=>p.name===name);
  if(same){ const old=same.id; delete s.players[old]; same.id=uid; s.players[uid]=same; s.order=s.order.map(x=>x===old?uid:x);
    for(const k in s.own) if(s.own[k].o===old) s.own[k].o=uid; return; }
  if(s.order.length>=MAX_PLAYERS)return false;
  const used=Object.values(s.players).map(p=>p.c); let c=0; while(used.includes(c))c++;
  s.players[uid]={id:uid,name,c,money:START_MONEY,pos:0,isl:0,ticket:0,space:false,out:false,dbl:0};
  s.order.push(uid); addLog(s,`👋 ${name} 입장`); }
function A_kick(s,id){ if(s.status!=="lobby"||!s.players[id])return false; delete s.players[id]; s.order=s.order.filter(x=>x!==id); }
function A_start(s){ if(s.status!=="lobby"||s.order.length<1)return false; s.status="play"; s.turn=0; s.phase="roll"; s.ctx=null; s.again=false; addLog(s,"🚩 게임 시작!"); }
function A_reset(s){ s.status="lobby"; s.own={}; s.pot=0; s.turn=0; s.phase="roll"; s.ctx=null; s.log=[]; s.ql={}; s.again=false;
  for(const id in s.players)Object.assign(s.players[id],{money:START_MONEY,pos:0,isl:0,ticket:0,space:false,out:false,dbl:0}); }
function A_clear(s){ const n=(s.anim&&s.anim.n)||0; for(const k in s)delete s[k]; Object.assign(s,fresh()); s.anim={n}; }
function A_finish(s){ if(s.status!=="play")return false; s.status="end"; s.ctx=null; s.phase="roll"; }
function A_skip(s){ if(s.status!=="play")return false; addLog(s,`⏭️ ${cur(s).name}의 차례를 넘겼습니다`); s.again=false; endTurn(s); }
function A_roll(s,uid){ if(!myTurn(s,uid)||s.phase!=="roll")return false; const p=cur(s);
  const d1=rnd(6)+1,d2=rnd(6)+1,dbl=d1===d2; s.again=false; p.space=false;
  const a={n:s.anim.n+1,uid:p.id,from:p.pos,dice:[d1,d2],mode:"fwd"};
  addLog(s,`🎲 ${p.name}: ${d1} + ${d2}${dbl?" (더블!)":""}`);
  if(p.isl>0){
    if(dbl){p.isl=0; addLog(s,`🏝️ ${p.name} 무인도 탈출!`);}
    else{ p.isl--; a.mode="stay"; a.to=p.pos; s.anim=a;
      info(s,"🏝️","무인도 탈출 실패",p.isl>0?`더블이 나오지 않았습니다.\n앞으로 ${p.isl}번 더 도전할 수 있습니다.`:"더블이 나오지 않았습니다.\n하지만 다음 차례부터는 자유롭게 이동할 수 있습니다!"); return; } }
  else if(dbl){ p.dbl=(p.dbl||0)+1;
    if(p.dbl>=3){ p.dbl=0; p.pos=ISLAND; p.isl=3; a.mode="jump"; a.to=ISLAND; s.anim=a; addLog(s,`🏝️ ${p.name} 더블 3번! 무인도행`);
      info(s,"🏝️","더블 3번!","더블이 3번 연속 나와 무인도로 이동합니다."); return; }
    s.again=true; }
  move(s,p,d1+d2); a.to=p.pos; s.anim=a; land(s,p); }
function A_ticket(s,uid){ if(!myTurn(s,uid)||s.phase!=="roll")return false; const p=cur(s); if(!(p.isl>0)||!(p.ticket>0))return false;
  p.ticket--; p.isl=0; addLog(s,`🎫 ${p.name} 무인도 탈출권 사용`); }
function A_fly(s,uid,to){ if(!myTurn(s,uid)||s.phase!=="roll")return false; const p=cur(s); to=+to;
  if(!p.space||!(to>=0&&to<40)||to===p.pos)return false; p.space=false; s.again=false;
  const a={n:s.anim.n+1,uid:p.id,from:p.pos,to,mode:"jump"};
  if(to<p.pos){p.money+=SALARY; addLog(s,`💵 ${p.name} 월급 $${SALARY}`);}
  p.pos=to; s.anim=a; addLog(s,`🚀 ${p.name} → ${(BOARD[to].c?BOARD[to].c.n:BOARD[to].n).replace("<br>"," ")}`); land(s,p); }
function A_answer(s,uid,i){ if(!myTurn(s,uid)||s.phase!=="quiz")return false; const c=s.ctx; i=+i;
  if(c.st!=="ask"&&c.st!=="hint")return false; c.wrong=c.wrong?Object.values(c.wrong):[]; if(c.wrong.includes(i))return false;
  const p=cur(s), nm=BOARD[c.sq].c.n;
  if(i===0){c.st="ok"; addLog(s,`⭕ ${p.name} ${nm} 문제 정답!`);}
  else{ c.wrong.push(i); c.tries++; c.st=c.tries>=2?"fail":"hint"; if(c.st==="fail")addLog(s,`❌ ${p.name} ${nm} 문제 실패`); } }
function A_buy(s,uid){ if(!myTurn(s,uid)||s.phase!=="quiz"||s.ctx.st!=="ok")return false; const p=cur(s),k=s.ctx.sq,price=BOARD[k].c.cost[0];
  if(p.money<price||s.own[k])return false; p.money-=price; s.own[k]={o:p.id,lv:0}; addLog(s,`🚩 ${p.name} ${BOARD[k].c.n} 구입 ($${price})`); endTurn(s); }
function A_build(s,uid){ if(!myTurn(s,uid)||s.phase!=="build")return false; const p=cur(s),k=s.ctx.sq,o=s.own[k];
  if(!o||o.o!==p.id||o.lv>=3)return false; const cost=BOARD[k].c.cost[o.lv+1]; if(p.money<cost)return false;
  p.money-=cost; o.lv++; addLog(s,`${LV_ICON[o.lv]} ${p.name} ${BOARD[k].c.n}에 ${LV_NAME[o.lv]} 건설 ($${cost})`); endTurn(s); }
function A_pass(s,uid){ if(!myTurn(s,uid))return false;
  if(s.phase==="info"||s.phase==="build"||(s.phase==="quiz"&&(s.ctx.st==="ok"||s.ctx.st==="fail"))){endTurn(s);return;} return false; }
function A_key(s,uid){ if(!myTurn(s,uid)||s.phase!=="key")return false; const p=cur(s),k=KEYS[s.ctx.k];
  addLog(s,`🔑 ${p.name}: ${k.t.split("\n")[0]}`);
  if(k.m>0)p.money+=k.m; else if(k.m<0)charge(s,p,-k.m,null);
  if(k.all){ for(const id of s.order){ const o=s.players[id]; if(o.id===p.id||o.out)continue;
      if(k.all>0)charge(s,o,k.all,p); else if(!p.out)charge(s,p,-k.all,o); } }
  if(k.ticket)p.ticket=(p.ticket||0)+1;
  if(k.fund){const r=charge(s,p,k.fund,null); s.pot+=r.paid;}
  if(k.repair){ let c=0; for(const q in s.own) if(s.own[q].o===p.id) c+=k.repair[s.own[q].lv]; if(c>0)charge(s,p,c,null); }
  if(p.out){endTurn(s);return;}
  if(k.go!=null){ const a={n:s.anim.n+1,uid:p.id,from:p.pos,to:k.go,mode:"jump"};
    if(k.go!==ISLAND&&k.go<=p.pos){p.money+=SALARY; addLog(s,`💵 ${p.name} 월급 $${SALARY}`);}
    p.pos=k.go; s.anim=a; land(s,p); return; }
  if(k.back){ const a={n:s.anim.n+1,uid:p.id,from:p.pos,mode:"back"}; p.pos=(p.pos-k.back+40)%40; a.to=p.pos; s.anim=a; land(s,p); return; }
  endTurn(s); }
//</LOGIC>

   저장소 : Firebase 실시간 DB (설정이 없으면 이 기기 안에서만 되는 연습 모드)
   ===================================================================== */
let USE_FB=false, db=null, fbErr="";
try{
  if(FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes("여기에") && FIREBASE_CONFIG.databaseURL && window.firebase){
    firebase.initializeApp(FIREBASE_CONFIG); db=firebase.database(); USE_FB=true;
  }
}catch(e){fbErr=String(e&&e.message||e);}
const clean=s=>JSON.parse(JSON.stringify(s));
function makeStore(key){
  if(USE_FB){ const ref=db.ref("burumarble/"+key); let h=null, ch=null;
    return { listen(cb){h=ref.on("value",sn=>cb(sn.val()),err=>alert("데이터베이스 읽기 오류: "+err.message+"\nFirebase 규칙을 확인하세요."));
        ch=db.ref(".info/connected"); ch.on("value",sn=>setNet(!!sn.val()));},
      update(fn){ return ref.transaction(c=>{const s=norm(c); if(fn(s)===false)return; return clean(s);})
        .catch(err=>alert("저장 오류: "+err.message+"\nFirebase 규칙을 확인하세요.")); },
      off(){ref.off(); if(ch)ch.off();} }; }
  const K="bm_room_"+key, bc=("BroadcastChannel" in window)?new BroadcastChannel(K):null; let cb0=null;
  const read=()=>{try{return JSON.parse(localStorage.getItem(K));}catch(e){return null;}};
  const onSt=e=>{if(e.key===K&&cb0)cb0(read());};
  return { listen(cb){cb0=cb; if(bc)bc.onmessage=()=>cb(read()); window.addEventListener("storage",onSt); cb(read());},
    update(fn){const s=norm(read()); if(fn(s)===false)return Promise.resolve(); localStorage.setItem(K,JSON.stringify(clean(s)));
      if(bc)bc.postMessage(1); if(cb0)cb0(read()); return Promise.resolve();},
    off(){cb0=null; if(bc)bc.close(); window.removeEventListener("storage",onSt);} };
}

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

/* ---- 상태 수신 & 애니메이션 ---- */
function onState(raw){ S=norm(raw);
  if(joined&&!SPEC&&!S.players[UID]){ leave(); return; }
  if(seenAnim===null){ seenAnim=S.anim.n; if(S.anim.dice)shownDice=Object.values(S.anim.dice); }
  else if(S.anim.n!==seenAnim){ seenAnim=S.anim.n; playAnim(S.anim); }
  render(); }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function playAnim(a){ const tk=++animToken; animating=true;
  for(const id of S.order) if(id!==a.uid) disp[id]=S.players[id].pos;
  disp[a.uid]=a.from; placeTokens(); render();
  if(a.dice){ const d=Object.values(a.dice); $("die1").classList.add("shake"); $("die2").classList.add("shake");
    for(let i=0;i<7;i++){ shownDice=[rnd(6)+1,rnd(6)+1]; drawDice(); await sleep(85); if(tk!==animToken)return; }
    $("die1").classList.remove("shake"); $("die2").classList.remove("shake"); shownDice=d; drawDice(); await sleep(350); if(tk!==animToken)return; }
  if(a.mode==="fwd"||a.mode==="back"){ const st=a.mode==="fwd"?1:-1; let pos=a.from, guard=0;
    while(pos!==a.to&&guard++<40){ pos=(pos+st+40)%40; disp[a.uid]=pos; placeTokens(); await sleep(190); if(tk!==animToken)return; } }
  else if(a.mode==="jump"){ await sleep(250); if(tk!==animToken)return; disp[a.uid]=a.to; placeTokens(); await sleep(450); if(tk!==animToken)return; }
  await sleep(250); if(tk!==animToken)return;
  animating=false; render(); }

function drawCenter(){ const p=S.status==="play"?cur(S):null, mine=p&&p.id===UID, rb=$("rollBtn"), tb=$("turnBox"), hl=$("hintLine");

    else h=mine?"내 차례입니다! 주사위를 굴리세요":"주사위를 기다리는 중…";
  }
  hl.innerHTML=h; }
function drawPlayers(){ let h="";
  S.order.forEach((id,i)=>{ const p=S.players[id], n=Object.values(S.own).filter(o=>o.o===id).length, turn=S.status==="play"&&i===S.turn;
    const st=[p.out?"파산":"", p.isl>0?"🏝️"+p.isl:"", p.space?"🚀":"", p.ticket>0?"🎫"+p.ticket:"", n?"🚩"+n:""].filter(Boolean).join(" ");
    h+=`<div class="pl${turn?" turn":""}${p.out?" dead":""}"><div class="dot" style="background:${COLORS[p.c]}">${esc(p.name.slice(0,1))}</div>
      <div class="nm">${esc(p.name)}${id===UID?" <small>(나)</small>":""}<div class="st">${st||"&nbsp;"}</div></div><div class="mn">${money(p.money)}</div></div>`; });
  $("players").innerHTML=h||'<div class="st" style="padding:8px">아직 입장한 사람이 없습니다.</div>';
  $("potLine").textContent="💰 모인 사회복지기금: "+money(S.pot);
  $("log").innerHTML=S.log.slice(-25).reverse().map(t=>`<div>${esc(t)}</div>`).join(""); }

function whoTag(){ const p=cur(S), mine=p.id===UID; return `<div class="who${mine?" mine":""}">${mine?"⭐ 내 차례":"👀 "+esc(p.name)+"의 차례 — 함께 지켜보세요"}</div>`; }
function cityHead(k){ const c=BOARD[k].c; return `<div class="cityHd"><div class="big">${c.e}</div><div><h2>${c.n}</h2><div class="ct">${c.k}</div></div></div>`; }
function priceRow(k,now){ const c=BOARD[k].c; return `<div class="prices">`+c.cost.map((v,i)=>`<div class="${i===now?"now":""}">${LV_ICON[i]} ${LV_NAME[i]}<b>${money(v)}</b></div>`).join("")+`</div>`; }
function drawModal(){ const m=$("modal"), card=$("modalCard"); let h="";
  if(S.status==="lobby"){ const inRoom=!!S.players[UID];
    h=`<div class="center"><div class="bigEm">🌍</div><h2 style="font-size:28px">${esc(roomLabel)} 대기실</h2>
      <p class="desc">모둠 친구들이 모두 들어오면 <b>게임 시작</b>을 누르세요. (최대 ${MAX_PLAYERS}명)</p></div>`;
    S.order.forEach(id=>{const p=S.players[id]; h+=`<div class="rank"><div class="dot" style="background:${COLORS[p.c]}">${esc(p.name.slice(0,1))}</div>${esc(p.name)}${id===UID?" (나)":""}
      <span class="as"><button class="kick" data-act="kick" data-v="${id}">내보내기</button></span></div>`;});
    if(!S.order.length)h+=`<div class="note hint center">아직 아무도 없습니다.</div>`;
    h+=`<div class="acts"><button class="btn gold" data-act="start" ${S.order.length&&(inRoom||SPEC)?"":"disabled"}>🚩 게임 시작 (${S.order.length}명)</button>
      <button class="btn gray" data-act="leave">${TEACHER?"교사 화면으로":"모둠 다시 고르기"}</button></div>
      <div class="note hint" style="font-size:13px">💡 시작 자금 ${money(START_MONEY)} · 한 바퀴 돌 때마다 월급 ${money(SALARY)} · 문제를 맞혀야 땅을 살 수 있어요!</div>`;
  }
  else if(S.status==="end"){ const rk=S.order.map(id=>S.players[id]).sort((a,b)=>(a.out-b.out)||assets(S,b)-assets(S,a));
    h=`<div class="center"><div class="bigEm">🏆</div><h2 style="font-size:30px">게임 종료!</h2><p class="desc">총자산 = 가진 돈 + 땅·건물에 들인 돈</p></div>`;
    rk.forEach((p,i)=>{h+=`<div class="rank"><div class="no">${["🥇","🥈","🥉"][i]||i+1}</div><div class="dot" style="background:${COLORS[p.c]}">${esc(p.name.slice(0,1))}</div>${esc(p.name)}
      <span class="as">${p.out?"파산":money(assets(S,p))}</span></div>`;});
    h+=`<div class="acts"><button class="btn gold" data-act="reset">🔄 새 게임 준비</button></div>`;
  }
  else if(S.phase==="roll"||!S.ctx){ m.classList.add("hidden"); return; }
  else { const p=cur(S), mine=p.id===UID, dis=mine?"":"disabled", c=S.ctx; h=whoTag();
    if(S.phase==="quiz"){ const city=BOARD[c.sq].c, q=city.q[c.qi], wrong=c.wrong?Object.values(c.wrong):[], ord=Object.values(c.ord), done=c.st==="ok"||c.st==="fail";
      h+=cityHead(c.sq)+`<p class="desc">${city.d}</p>`+priceRow(c.sq,0)+
        `<div class="qbox"><div class="ql">🧪 도전 문제 — 맞히면 땅을 살 수 있어요!</div><div class="qt">${q.q}</div></div><div class="opts">`;
      ord.forEach((oi,n)=>{ const cls=wrong.includes(oi)?"x":(done&&oi===0?"o":"");
        h+=`<button class="opt ${cls}" data-act="ans" data-v="${oi}" ${(!mine||done||wrong.includes(oi))?"disabled":""}>${"①②③④"[n]} ${q.o[oi]}</button>`; });
      h+=`</div>`;
      if(c.st==="hint")h+=`<div class="note hint">❌ 아쉬워요! <b>한 번 더</b> 도전할 수 있어요.<br>💡 <b>힌트:</b> ${q.h}</div>`;
      if(c.st==="ok"){ const price=city.cost[0], can=p.money>=price;
        h+=`<div class="note good">⭕ <b>정답입니다!</b> ${q.x}</div><div class="acts">
          <button class="btn green" data-act="buy" ${mine&&can?"":"disabled"}>🚩 땅 사기 (${money(price)})</button>
          <button class="btn gray" data-act="pass" ${dis}>사지 않기</button></div>`+(can?"":`<div class="note bad">돈이 부족해서 살 수 없습니다.</div>`); }
      if(c.st==="fail")h+=`<div class="note bad">❌ 아쉽지만 이번에는 땅을 살 수 없어요.<br>📘 <b>정답 해설:</b> ${q.x}</div>
          <div class="acts"><button class="btn" data-act="pass" ${dis}>확인</button></div>`;
    }
    else if(S.phase==="build"){ const city=BOARD[c.sq].c, o=S.own[c.sq], nx=o.lv+1, cost=city.cost[nx], can=p.money>=cost;
      h+=cityHead(c.sq)+`<p class="desc">${city.d}</p>`+priceRow(c.sq,nx)+
        `<div class="note good">🎉 내 땅에 도착했습니다! 현재 <b>${LV_ICON[o.lv]} ${LV_NAME[o.lv]}</b> → <b>${LV_ICON[nx]} ${LV_NAME[nx]}</b>을(를) 지을 수 있습니다.<br>
         통행료가 ${money(tollOf(S,c.sq))} → <b>${money(Math.round((invested(S,c.sq)+cost)*0.5/10)*10)}</b>로 올라갑니다.</div>
        <div class="acts"><button class="btn green" data-act="build" ${mine&&can?"":"disabled"}>${LV_ICON[nx]} ${LV_NAME[nx]} 짓기 (${money(cost)})</button>
        <button class="btn gray" data-act="pass" ${dis}>짓지 않기</button></div>`+(can?"":`<div class="note bad">돈이 부족해서 지을 수 없습니다.</div>`);
    }
    else if(S.phase==="key"){ const k=KEYS[c.k];
      h+=`<div class="center"><div class="bigEm">🔑</div><h2 style="font-size:28px">황금열쇠</h2><div class="msg">${esc(k.t)}</div></div>
        <div class="acts"><button class="btn gold" data-act="key" ${dis}>확인</button></div>`;
    }
    else if(S.phase==="info"){
      h+=`<div class="center"><div class="bigEm">${c.e||"ℹ️"}</div><h2 style="font-size:28px">${esc(c.title||"")}</h2><div class="msg">${esc(c.msg||"")}</div></div>
        <div class="acts"><button class="btn gold" data-act="pass" ${dis}>확인</button></div>`;
    }
  }
  h+=`<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">${TEACHER?'<button class="btn sm gold" data-act="leave">← 교사 화면으로</button>':""}<button class="btn sm gray" data-act="menu">☰ 메뉴 · 다시 시작</button></div>`;
  card.innerHTML=h; m.classList.remove("hidden"); }

/* ---- 버튼 처리 ---- */
function act(fn){ if(store)return store.update(fn); }
const canAct=()=>SPEC||!!S.players[UID];
$("modalCard").onclick=e=>{ const b=e.target.closest("[data-act]"); if(!b||b.disabled)return; const a=b.dataset.act, v=b.dataset.v;
  if(a==="ans")act(s=>A_answer(s,UID,v)); else if(a==="buy")act(s=>A_buy(s,UID)); else if(a==="build")act(s=>A_build(s,UID));
  else if(a==="pass")act(s=>A_pass(s,UID)); else if(a==="key")act(s=>A_key(s,UID));
  else if(a==="start"){if(canAct())act(s=>A_start(s));} else if(a==="kick"){if(canAct())act(s=>A_kick(s,v));}
  else if(a==="reset"){if(canAct())act(s=>A_reset(s));} else if(a==="leave")leave(); else if(a==="menu")$("btnMenu").click(); };
$("rollBtn").onclick=()=>{ $("rollBtn").disabled=true; act(s=>A_roll(s,UID)); };

/* ---- 작은 팝업 : 칸 정보 / 메뉴 / 확인 ---- */
function showPop(h){$("popCard").innerHTML=h; $("pop").classList.remove("hidden");}
function closePop(){$("pop").classList.add("hidden");}
$("pop").onclick=e=>{ if(e.target.id==="pop")closePop(); };
function openCell(i){ const sq=BOARD[i], me=S.players[UID], fly=me&&me.space&&myTurn(S,UID)&&S.phase==="roll"&&!animating&&i!==me.pos; let h="";
  if(sq.t==="city"){ const o=S.own[i], ow=o&&S.players[o.o];
    h=cityHead(i)+`<p class="desc">${sq.c.d}</p>`+priceRow(i,o?o.lv:-1)+
      `<div class="note ${ow?"good":"hint"}">${ow?`주인: <b style="color:${COLORS[ow.c]}">●</b> <b>${esc(ow.name)}</b> (${LV_ICON[o.lv]} ${LV_NAME[o.lv]}) · 통행료 <b>${money(tollOf(S,i))}</b>`:"아직 주인이 없는 땅입니다. 도착해서 문제를 맞히면 살 수 있어요!"}</div>`; }
  else { const T={start:"한 바퀴를 돌아 이곳을 지나거나 도착하면 월급 "+money(SALARY)+"을 받습니다.",key:"황금열쇠 카드를 한 장 뽑습니다. 행운일 수도, 불운일 수도!",
      island:"3번의 차례 동안 갇힙니다. 주사위 더블이 나오거나 탈출권을 쓰면 나올 수 있어요.",fundget:"그동안 모인 사회복지기금을 모두 받습니다. (현재 "+money(S.pot)+")",
      fundpay:"사회복지기금 "+money(FUND_FEE)+"을 냅니다.",space:"다음 차례에 원하는 칸 어디든 날아갈 수 있습니다."};
    h=`<div class="center"><div class="bigEm">${sq.e}</div><h2 style="font-size:26px">${sq.n.replace("<br>"," ")}</h2><div class="msg">${T[sq.t]}</div></div>`; }
  h+=`<div class="acts">`+(fly?`<button class="btn green" onclick="closePop();act(s=>A_fly(s,UID,${i}))">🚀 여기로 이동</button>`:"")+`<button class="btn gray" onclick="closePop()">닫기</button></div>`;
  showPop(h); }
function confirmPop(msg,label,fn){ showPop(`<div class="center"><div class="msg">${msg}</div></div><div class="acts"><button class="btn red" id="cfY">${label}</button><button class="btn gray" onclick="closePop()">취소</button></div>`);
  $("cfY").onclick=()=>{closePop(); fn();}; }
$("btnMenu").onclick=()=>{ const ok=canAct()?"":"disabled", playing=S.status==="play";
  showPop(`<h2 style="font-size:24px">☰ 메뉴</h2><div class="menuList">
    <button class="btn" id="mSkip" ${playing?ok:"disabled"}>⏭️ 현재 차례 넘기기 (자리를 비운 친구가 있을 때)</button>
    <button class="btn" id="mEnd" ${playing?ok:"disabled"}>🏁 게임 끝내고 순위 보기</button>
    <button class="btn red" id="mReset" ${ok}>🔄 새 게임 (처음부터 다시)</button>
    <button class="btn gray" id="mLeave">${TEACHER?"← 교사 화면으로":"🚪 모둠 다시 고르기"}</button>
    <button class="btn gray" onclick="closePop()">닫기</button></div>
    <div class="note hint" style="font-size:13px">📖 <b>규칙 요약</b><br>· 빈 땅에 도착 → 문제를 맞히면 구입 (틀리면 힌트와 함께 한 번 더!)<br>· 내 땅에 다시 도착 → 별장 → 빌딩 → 호텔 순서로 건설<br>· 남의 땅에 도착 → 통행료 지불 (투자 금액의 50 %)<br>· 더블이 나오면 한 번 더, 3번 연속이면 무인도!<br>· 돈이 모자라면 가진 땅이 은행에 반값으로 팔리고, 그래도 모자라면 파산</div>`);
  $("mSkip").onclick=()=>confirmPop("현재 차례를 다음 사람에게 넘길까요?","넘기기",()=>act(s=>A_skip(s)));
  $("mEnd").onclick=()=>confirmPop("게임을 끝내고 순위를 볼까요?","끝내기",()=>act(s=>A_finish(s)));
  $("mReset").onclick=()=>confirmPop("모든 기록을 지우고 새 게임을 준비할까요?<br>(모둠 전체에 적용됩니다)","새 게임",()=>act(s=>A_reset(s)));
  $("mLeave").onclick=()=>{closePop(); leave();}; };
$("btnRestart").onclick=()=>{ if(!canAct())return; confirmPop("게임을 처음부터 다시 시작할까요?<br>(모둠 전체의 돈과 땅이 초기화됩니다)","다시 시작",()=>act(s=>A_reset(s))); };
$("btnBackT").onclick=leave;
drawDice();
</script>
</body>
</html>
